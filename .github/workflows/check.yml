name: Tests and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-pil python3-cryptography python3-zeroconf python3-bleak python3-evdev fonts-noto-cjk dpkg-dev
      - uses: actions/checkout@v4
      - name: Run isolated protocol and UI tests
        run: python3 -m unittest discover -s tests -v
      - name: Build ARM64 package
        run: python3 packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: airsim-cardputer-arm64
          path: dist/*.deb
